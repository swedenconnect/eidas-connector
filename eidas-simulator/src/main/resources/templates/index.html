<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/base :: headerFragment(title='eIDAS Simulator')}"></head>
<body>
<header th:replace="~{fragments/base :: header(country=null)}"></header>

<main class="container main">
  <div class="row">
    <div class="col-sm-12 content-container">
      <div class="content-heading">
        <h1>eIDAS Simulator</h1>
      </div>
      <p class="info">
        The simulator acts as the eIDAS proxy services of the countries below. Each country has its own entityID,
        endpoints and metadata.
      </p>
      <p>
        <a th:href="@{/metadata}" href="#">Aggregated metadata of all countries</a>
      </p>

      <table class="table table-sm align-middle">
        <thead>
        <tr>
          <th scope="col">Country</th>
          <th scope="col">EntityID (metadata)</th>
          <th scope="col">Users</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${countries}">
          <td>
            <img class="simulator-flag-small me-2" th:src="@{/images/flags/{f}.svg(f=${#strings.toLowerCase(c.code)})}"
                 alt=""/>
            <span th:text="|${c.name} (${c.code})|">Austria (AT)</span>
          </td>
          <td><a th:href="${c.entityId}" th:text="${c.entityId}" href="#">entityID</a></td>
          <td th:text="${#lists.size(c.users)}">3</td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<footer th:replace="~{fragments/base :: footer}"></footer>
</body>
</html>
