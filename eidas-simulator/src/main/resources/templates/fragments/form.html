<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>

<!--/* A text input for an attribute value of the user. Must be used inside the form with th:object="${form}". */-->
<div class="row mb-2" th:fragment="text(label, field, required)">
  <label class="col-sm-4 col-form-label" th:for="${field}" th:text="${label}"
         th:classappend="${required} ? 'simulator-required'">Label</label>
  <div class="col-sm-8">
    <input type="text" class="form-control" th:id="${field}" th:field="*{__${field}__}"/>
  </div>
</div>

</body>
</html>
