<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/base :: headerFragment(title='eIDAS Simulator')}"></head>
<body onload="document.forms[0].submit()">
<form method="POST" action="#" th:action="${action}">
  <input type="hidden" name="SAMLResponse" th:value="${SAMLResponse}"/>
  <input th:if="${RelayState != null}" type="hidden" name="RelayState" th:value="${RelayState}"/>

  <noscript>
    <main class="container main">
      <div class="row">
        <div class="col-sm-12 content-container">
          <p class="info">JavaScript is turned off. Press the button to send the response.</p>
          <button type="submit" class="btn btn-primary">Continue</button>
        </div>
      </div>
    </main>
  </noscript>
</form>
</body>
</html>
