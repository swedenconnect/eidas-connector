<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/base :: headerFragment(title='eIDAS Simulator - Error')}"></head>
<body>
<header th:replace="~{fragments/base :: header(country=null)}"></header>

<main class="container main">
  <div class="row">
    <div class="col-sm-12 content-container">
      <div class="content-heading">
        <h1>The request cannot be processed</h1>
      </div>
      <div class="alert alert-danger" role="alert">
        <p class="mb-0" th:text="${message}">Error message</p>
      </div>
      <p class="info">
        The connector or its assertion consumer service could not be established, so no response can be sent. A
        production eIDAS node shows an error page in this situation as well.
      </p>
    </div>
  </div>
</main>

<footer th:replace="~{fragments/base :: footer}"></footer>
</body>
</html>
