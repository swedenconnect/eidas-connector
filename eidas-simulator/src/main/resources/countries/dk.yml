#
# Simulated eIDAS node: Denmark (DK).
#
# The settings mirror the entry for DK in the production metadata,
# https://md.eidas.swedenconnect.se/role/idp.xml, except for URLs and keys. Entity attributes that hold
# hashes of production URLs or keys are left out.
#
simulator:
  countries:
    DK:
      name: "Denmark"
      protocol-versions:
        - "1.2"
        - "1.3"
      assurance-certifications:
        - "http://eidas.europa.eu/LoA/substantial"
        - "http://eidas.europa.eu/LoA/high"
      digest-methods:
        - "http://www.w3.org/2001/04/xmldsig-more#sha384"
        - "http://www.w3.org/2001/04/xmlenc#sha512"
        - "http://www.w3.org/2001/04/xmlenc#sha256"
      signing-methods:
        - algorithm: "http://www.w3.org/2001/04/xmldsig-more#rsa-sha512"
        - algorithm: "http://www.w3.org/2001/04/xmldsig-more#rsa-sha256"
        - algorithm: "http://www.w3.org/2001/04/xmldsig-more#rsa-sha384"
        - algorithm: "http://www.w3.org/2001/04/xmldsig-more#ecdsa-sha256"
        - algorithm: "http://www.w3.org/2001/04/xmldsig-more#ecdsa-sha384"
        - algorithm: "http://www.w3.org/2001/04/xmldsig-more#ecdsa-sha512"
        - algorithm: "http://www.w3.org/2007/05/xmldsig-more#sha256-rsa-MGF1"
      name-id-formats:
        - "urn:oasis:names:tc:SAML:2.0:nameid-format:persistent"
        - "urn:oasis:names:tc:SAML:2.0:nameid-format:transient"
        - "urn:oasis:names:tc:SAML:1.1:nameid-format:unspecified"
      bindings:
        - "urn:oasis:names:tc:SAML:2.0:bindings:HTTP-POST"
        - "urn:oasis:names:tc:SAML:2.0:bindings:HTTP-Redirect"
      # Production signing key: RSA 3072
      # Production encryption key: RSA 3072
      encryption-key:
        encryption-methods:
          - "http://www.w3.org/2009/xmlenc11#aes192-gcm"
          - "http://www.w3.org/2009/xmlenc11#aes256-gcm"
          - "http://www.w3.org/2009/xmlenc11#aes128-gcm"
      attributes:
        - name: "http://eidas.europa.eu/attributes/naturalperson/CurrentAddress"
          friendly-name: "CurrentAddress"
        - name: "http://eidas.europa.eu/attributes/naturalperson/CurrentFamilyName"
          friendly-name: "FamilyName"
        - name: "http://eidas.europa.eu/attributes/naturalperson/CurrentGivenName"
          friendly-name: "FirstName"
        - name: "http://eidas.europa.eu/attributes/naturalperson/DateOfBirth"
          friendly-name: "DateOfBirth"
        - name: "http://eidas.europa.eu/attributes/naturalperson/Gender"
          friendly-name: "Gender"
        - name: "http://eidas.europa.eu/attributes/naturalperson/PersonIdentifier"
          friendly-name: "PersonIdentifier"
        - name: "http://eidas.europa.eu/attributes/naturalperson/PlaceOfBirth"
          friendly-name: "PlaceOfBirth"
