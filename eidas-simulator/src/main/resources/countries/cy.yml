#
# Simulated eIDAS node: Cyprus (CY).
#
# The settings mirror the entry for CY in the production metadata,
# https://md.eidas.swedenconnect.se/role/idp.xml, except for URLs and keys. Entity attributes that hold
# hashes of production URLs or keys are left out.
#
simulator:
  countries:
    CY:
      name: "Cyprus"
      protocol-versions:
        - "1.4.1"
        - "1.4"
        - "1.3"
        - "1.2"
      application-identifier: "eIDAS-ref:3.0.0"
      assurance-certifications:
