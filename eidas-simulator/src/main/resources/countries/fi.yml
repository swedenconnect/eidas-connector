          given-name: "Mikko"
          family-name: "Korhonen"
          date-of-birth: "1980-03-12"
        - id: "aino"
          person-identifier: "241195-2841"
          given-name: "Aino"
          family-name: "Virtanen"
          date-of-birth: "1995-11-24"
        - id: "juha"
