#
# Test profile for the authentication flow test. It is applied on top of the base configuration. The locations of
# keys, metadata and the PRID policy are given by the test.
#
connector:
  domain: www.example.com
  base-url: https://www.example.com/idp
  development-mode: true
  country: SE
  eidas:
    credentials:
      default-credential:
        bundle: connector
  idp:
    ping-whitelist:
      - https://rp.example.com

authn-server:
  saml:
    entity-id: https://connector.example.com/eidas
    credentials:
      default-credential:
        bundle: connector
  #
  # The clients are given by the test.
  #
  oidc:
    enabled: true
    subject-identifier:
      secret: test-subject-secret
    keys:
      signing:
        - credential:
            bundle: connector
    client-authentication-methods:
      - client_secret_basic

logging:
  level:
    se:
      swedenconnect: INFO
