#
# Messages for errors that cannot be reported back to the Service Provider. They are displayed on the error page.
#
authn-server.error.unrecoverable.internal=An internal error occurred
authn-server.error.unrecoverable.session=Required session data could not be found
authn-server.error.saml.unrecoverable.unknown-peer=The sender of the authentication request has not been registered at the Identity Provider
authn-server.error.saml.unrecoverable.peer-lookup-failed=The sender of the authentication request could not be looked up
authn-server.error.saml.unrecoverable.replay=Authentication request message has already been processed
authn-server.error.saml.unrecoverable.too-old=Recived message is too old and not accepted
authn-server.error.saml.unrecoverable.acs=Invalid message - Indicated response URL has not been registered
authn-server.error.saml.unrecoverable.no-signature=Security Error - Missing signature on request message
authn-server.error.saml.unrecoverable.bad-signature=Security Error - Signature validation on received authentication request failed
authn-server.error.saml.unrecoverable.format=Invalid message - The format on the received authentication request is invalid
authn-server.error.saml.unrecoverable.decode=Invalid message - The received message could not be decoded into a valid authentication request
authn-server.error.saml.unrecoverable.endpoint=Invalid message - The endpoint information supplied in the authentication request do not \
  correspond with the endpoint on which the message was delivered

#
# Status messages of SAML error responses. They are always resolved in English.
#
authn-server.error.authn-failed=Authentication failed
authn-server.error.cancel=User cancelled authentication
authn-server.error.sign-message-not-displayed=SignMessage could not be displayed
authn-server.error.passive-not-possible=Passive authentication could not be performed
authn-server.error.no-authn-context=Requested authentication context(s) not supported
authn-server.error.unknown-principal=Unknown principal
authn-server.error.not-authorized=Not authorized to send requests
authn-server.error.saml.sign-message=Invalid SignMessage extension
authn-server.error.saml.invalid-request=Invalid authentication request
authn-server.error.saml.invalid-nameid-policy=Invalid NameIDPolicy in authentication request
authn-server.error.saml.no-encrypt-capabilities=Missing key descriptor for encryption
authn-server.error.saml.invalid-user-message=Invalid UserMessage extension
