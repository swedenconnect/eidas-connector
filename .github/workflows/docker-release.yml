# Publishes the Docker image of the eIDAS Connector when a version tag is pushed.
#
# The Maven version is set by internal/release.sh and committed before tagging, so the tag must match it: the tag
# v3.0.0 requires the version 3.0.0 in the POMs. The image is tagged with the version and with latest. No image is
# ever published for a snapshot version.
name: Release Docker image

on:
  push:
    tags:
      - 'v*'

# Narrowed to what building and pushing the image requires.
permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish Docker image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # Nothing has been built at this point, so a tag that does not match publishes nothing.
      - name: Check that the tag matches the Maven version of every module
        env:
          TAG: ${{ github.ref_name }}
        run: ./internal/check-release-version.sh "${TAG}"

      # Jib reads the credentials that this login stores, so the workflow token is all it needs.
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image is built from the idp module alone, so the prid module it depends on has to be
      # installed first. The tests were run by internal/release.sh before the tag was pushed.
      - name: Install the reactor modules
        run: mvn clean install -DskipTests --no-transfer-progress

      # The Jib setup in the POM builds for linux/amd64 and linux/arm64 and pushes to
      # ghcr.io/swedenconnect/eidas-connector:<version>. latest is added here.
      - name: Build and publish image
        working-directory: idp
        run: mvn jib:build -Djib.to.tags=latest --no-transfer-progress
